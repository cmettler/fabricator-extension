# Test environment for fabricator: SQL Server 2025 + MinIO (S3-compatible object storage).
#
# Bring-up (see docker/README.md):
#   1. pwsh docker/certs/generate-certs.ps1     # self-signed TLS cert for MinIO (gitignored output)
#   2. docker compose -f docker/docker-compose.yml up -d
#   3. pwsh docker/provision.ps1                # creates the ArrowTest + TestDB databases
#
# SQL Server 2025 (17.x) reads CSV/Parquet/DELTA on S3 NATIVELY (no PolyBase package/service needed
# for file queries — the data-virtualization guide: "no longer requires installing or running PolyBase
# services"). The S3 connector REQUIRES HTTPS: MinIO auto-enables TLS from the certs mounted at
# /root/.minio/certs, and SQL Server trusts the self-signed cert via the CA file mounted at
# /var/opt/mssql/security/ca-certificates (read once at process start). The cert's SANs must cover the
# host SQL uses in LOCATION ('s3://minio:9000/') and the host the DuckDB tests use ('localhost:9000').
#
# Fallback (NOT installed by default — only needed for RDBMS connectors, not S3 file queries):
#   mssql-server-polybase exists for 2025/Ubuntu 24.04. To add it, build a custom image:
#     FROM mcr.microsoft.com/mssql/server:2025-latest
#     USER root
#     RUN curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/mssql-server-2025.list \
#           > /etc/apt/sources.list.d/mssql-server.list \
#      && apt-get update && ACCEPT_EULA=Y apt-get install -y mssql-server-polybase \
#      && rm -rf /var/lib/apt/lists/*
#     USER mssql
#
# MinIO credentials are TEST-ONLY and deliberately ALPHANUMERIC — SQL Server's S3 credential requires
# "Access Key ID and Secret Key ID must only contain alphanumeric values".

name: mssql-fabricator

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    # Survive a host reboot. Without this the containers exit and STAY exited — which happened on
    # 2026-07-30 (an overnight OS update rebooted the box) and surfaced only as the whole service tier
    # failing at each suite's first ATTACH with 'error 258: server not found'. `unless-stopped` rather
    # than `always`, so an explicit `docker compose stop` still means stopped.
    restart: unless-stopped
    container_name: mssql-fabricator
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Arrow_Net_123!
      # SQL Server Agent runs the CDC capture + cleanup jobs. Without it `sp_cdc_enable_table` still
      # succeeds (printing "SQLServerAgent is not currently running") but NOTHING is ever captured, so a
      # CDC test would pass vacuously against empty change tables. See docs/mssql-cdc.md §10.
      - MSSQL_AGENT_ENABLED=true
    volumes:
      - mssql-data:/var/opt/mssql
      # CA trust for the MinIO self-signed cert (SQL Server on Linux reads this folder at startup).
      - ./certs/public.crt:/var/opt/mssql/security/ca-certificates/minio.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Arrow_Net_123!' -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    # ⚠⚠ THIS IMAGE HAS MOVED TWICE, BOTH TIMES BECAUSE THE PUBLISHER WITHDREW IT — treat the registry as
    # the fragile part of this rig, not the software. 2026-09-13: `minio/minio` + `minio/mc` on Docker Hub
    # became unpullable, so we moved to quay.io. 2026-10-20: quay.io went the same way ("unauthorized"),
    # and this time it is TOTAL -- the quay tag listing itself now demands authentication, Docker Hub
    # denies access, and even the raw binaries at dl.min.io answer 410 Gone. MinIO no longer distributes
    # a community build at all.
    #
    # `bitnamilegacy/minio` is Bitnami's frozen mirror of the real MinIO (they moved their free images
    # there in 2025) and is the newest freely obtainable build: 2025.7.23, which is ~6 weeks OLDER than
    # the last image we had cached (RELEASE.2025-09-07). PINNED to an exact tag on purpose -- a moving
    # `latest` on a frozen mirror is the worst of both worlds.
    #
    # ⚠ Both previous breakages hit the SCHEDULED service tier while local runs kept passing on a cached
    # image; this one killed it from 2026-10-17. Do NOT read a green local service tier as evidence that
    # the rig can be provisioned from scratch -- only a clean machine pulls, so only CI notices.
    #
    # ⚠ Bitnami conventions differ from the official image and all three matter: it runs as NON-ROOT
    # (uid 1001), the data dir is /bitnami/minio/data (not /data), and the certs dir is /certs (not
    # /root/.minio/certs). MINIO_DEFAULT_BUCKETS replaces the old `createbucket` service, which is why
    # there is no longer a second image to lose.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    # Survive a host reboot. Without this the containers exit and STAY exited — which happened on
    # 2026-07-30 (an overnight OS update rebooted the box) and surfaced only as the whole service tier
    # failing at each suite's first ATTACH with 'error 258: server not found'. `unless-stopped` rather
    # than `always`, so an explicit `docker compose stop` still means stopped.
    restart: unless-stopped
    container_name: minio-fabricator
    ports:
      - "9000:9000"   # S3 API (HTTPS — certs auto-enable TLS)
      - "9001:9001"   # web console
    environment:
      - MINIO_ROOT_USER=miniouser
      - MINIO_ROOT_PASSWORD=miniosecret123
      # Without this the bundled mc talks http to an https server and the bucket is never created.
      - MINIO_SCHEME=https
      # Replaces the old one-shot `createbucket` service. ⚠ It runs mc against our own self-signed
      # endpoint, which only works because certs/CAs/public.crt is copied into mc's trust store by the
      # image's setup.sh — see docker/certs/generate-certs.ps1, which writes that copy.
      - MINIO_DEFAULT_BUCKETS=fabricator
    volumes:
      - minio-data:/bitnami/minio/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mssql-data:
  minio-data:
