# Test environment for fabricator: SQL Server 2025 + RustFS (S3-compatible object storage).
#
# Bring-up (see docker/README.md):
#   1. pwsh docker/certs/generate-certs.ps1     # self-signed TLS cert for RustFS (gitignored output)
#   2. docker compose -f docker/docker-compose.yml up -d
#   3. pwsh docker/provision.ps1                # creates the ArrowTest + TestDB databases
#
# SQL Server 2025 (17.x) reads CSV/Parquet/DELTA on S3 NATIVELY (no PolyBase package/service needed
# for file queries — the data-virtualization guide: "no longer requires installing or running PolyBase
# services"). The S3 connector REQUIRES HTTPS: RustFS serves TLS from the certs mounted at /certs, and
# SQL Server trusts the self-signed cert via the CA file mounted at
# /var/opt/mssql/security/ca-certificates (read once at process start). The cert's SANs must cover the
# host SQL uses in LOCATION ('s3://rustfs:9000/') and the host the DuckDB tests use ('localhost:9000').
#
# Fallback (NOT installed by default — only needed for RDBMS connectors, not S3 file queries):
#   mssql-server-polybase exists for 2025/Ubuntu 24.04. To add it, build a custom image:
#     FROM mcr.microsoft.com/mssql/server:2025-latest
#     USER root
#     RUN curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/mssql-server-2025.list \
#           > /etc/apt/sources.list.d/mssql-server.list \
#      && apt-get update && ACCEPT_EULA=Y apt-get install -y mssql-server-polybase \
#      && rm -rf /var/lib/apt/lists/*
#     USER mssql
#
# S3 credentials are TEST-ONLY and deliberately ALPHANUMERIC — SQL Server's S3 credential requires
# "Access Key ID and Secret Key ID must only contain alphanumeric values". (`miniouser`/`miniosecret123` are
# left from the MinIO days; the suites create a SQL Server credential from them only when it is absent.)

name: mssql-fabricator

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    # Survive a host reboot. Without this the containers exit and STAY exited — which happened on
    # 2026-07-30 (an overnight OS update rebooted the box) and surfaced only as the whole service tier
    # failing at each suite's first ATTACH with 'error 258: server not found'. `unless-stopped` rather
    # than `always`, so an explicit `docker compose stop` still means stopped.
    restart: unless-stopped
    container_name: mssql-fabricator
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Arrow_Net_123!
      # SQL Server Agent runs the CDC capture + cleanup jobs. Without it `sp_cdc_enable_table` still
      # succeeds (printing "SQLServerAgent is not currently running") but NOTHING is ever captured, so a
      # CDC test would pass vacuously against empty change tables. See docs/mssql-cdc.md §10.
      - MSSQL_AGENT_ENABLED=true
    volumes:
      - mssql-data:/var/opt/mssql
      # CA trust for the self-signed S3 cert (SQL Server on Linux reads this folder at startup).
      - ./certs/public.crt:/var/opt/mssql/security/ca-certificates/s3.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Arrow_Net_123!' -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # SQL Server 2025 WITH PolyBase, for the DuckLake-over-ODBC experiment (docs/ducklake-catalog.md §12).
  # OPT-IN: only `docker compose --profile polybase up -d` starts it, so the service tier and CI are untouched.
  # Its own port, volume and image (docker/polybase/Dockerfile). The ODBC side — the DuckDB ODBC driver, our
  # loadable + managed payload, odbc.ini and the session init file — is staged on the host into
  # docker/polybase/stage (gitignored, see docker/polybase/stage.sh) and mounted read-only.
  # ⚠ PolyBase on Linux refuses a hostname longer than 15 characters, hence the explicit one.
  sqlpoly:
    build: ./polybase
    image: fabricator-sqlpoly:dev
    profiles: ["polybase"]
    restart: unless-stopped
    container_name: mssql-fabricator-polybase
    hostname: sqlpoly
    # gdb can attach to the External Execution Service (a test rig: its threads were the thing to debug)
    cap_add: ["SYS_PTRACE"]
    ports:
      - "1434:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Arrow_Net_123!
    volumes:
      - mssql-poly-data:/var/opt/mssql
      - ./certs/public.crt:/var/opt/mssql/security/ca-certificates/s3.crt:ro
      - ./polybase/stage:/opt/duckodbc:ro
      - ./polybase/stage/odbc.ini:/etc/odbc.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Arrow_Net_123!' -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # RustFS (Apache-2.0, maintained) is the S3 store since 2026-11-09. It replaced MinIO, whose community image is no
  # longer published anywhere (quay.io and Docker Hub refuse, dl.min.io answers 410 Gone; we had been running Bitnami's
  # frozen 2025.7.23 mirror). Measured on 1.0.4 before the switch: put-if-absent (If-None-Match: *), which our S3
  # commits depend on, is atomic (20 rounds of 32 concurrent writers, one winner each), and the full service tier is
  # green against it at the same counts as against MinIO.
  # ⚠ The lesson from MinIO, kept: a registry can withdraw an image, and a green LOCAL run proves nothing about that
  # (it uses the cached image). Only a clean machine pulls, so only CI notices. Pinned to an exact tag.
  # TLS from certs/rustfs (generate-certs.ps1, the same pair under RustFS's file names). The bucket comes from
  # `rustfs-init` below (RustFS's own client, rc). Endpoints: localhost:9000 from the host (DuckDB), rustfs:9000
  # inside the compose network (SQL Server).
  rustfs:
    image: rustfs/rustfs:1.0.4
    # Survive a host reboot (an exited store once surfaced as every suite failing at its first ATTACH).
    restart: unless-stopped
    container_name: rustfs-fabricator
    ports:
      - "9000:9000"   # S3 API (HTTPS)
    environment:
      - RUSTFS_ACCESS_KEY=miniouser
      - RUSTFS_SECRET_KEY=miniosecret123
      - RUSTFS_TLS_PATH=/certs
    volumes:
      - rustfs-data:/data
      - ./certs/rustfs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -o /dev/null https://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # One-shot: creates the `fabricator` bucket in RustFS with rc, RustFS's own client (`-p`: an existing bucket is
  # fine, so it is re-runnable). --insecure because rc's TLS stack (rustls) refuses our certificate: it is self-signed
  # with CA:TRUE, i.e. a CA used as the server's own certificate (CaUsedAsEndEntity), which curl, SQL Server and
  # MinIO's mc accepted. A separate CA + server certificate would let it verify.
  rustfs-init:
    image: rustfs/rc:v0.1.37
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rc alias set rfs https://rustfs:9000 miniouser miniosecret123 --insecure &&
        rc bucket create -p rfs/fabricator

volumes:
  mssql-data:
  rustfs-data:
  mssql-poly-data:
