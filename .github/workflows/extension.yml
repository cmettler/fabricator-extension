# Tier 1: build the extension and run every suite that needs no external service.
#
# This is where the coverage is — 56 suites in 60 RUNS / 5459 assertions (measured 2026-07-30), the
# Delta catalog work: transactions (943), row tracking (299), column mapping (251), variant (157),
# native write (147), clustered optimize (147), row-level concurrency (70)... None of it needs SQL
# Server, MinIO, Power BI Desktop or live Fabric credentials, only a writable directory and the
# fixtures committed to this repo.
#
# 60 runs from 56 suites because four of them — write / transactions / update / delete — run ONCE PER
# DELTA ENGINE. Since the provider NAME picks a default engine ('delta' = DuckDB moves the parquet
# bytes, 'engineeredwooddelta' = engineered-wood's codec does), those four interpolate
# ${DELTA_PROVIDER} and must come out identical either way; run-suites.sh drives both legs.
#
# Deliberately NOT in this workflow:
#   * the 38 SQL Server suites and 3 S3/PolyBase ones — they need the docker/docker-compose.yml
#     stack (SQL Server 2025 + MinIO + generated TLS certs). Tier 2, on a schedule.
#   * DAX (needs Power BI Desktop) and live Fabric/OneLake (needs credentials that are gitignored
#     by design). Not automatable; manual gates.
#   * pack-distribution + smoke_distribution.py. They need their own toolchain (NativeAOT: the MSVC
#     linker or clang) and a stock DuckDB wheel driven from OUTSIDE the repo, so they get their own
#     workflow rather than making this one longer and harder to read.
#
# The build itself lives in .github/actions/build-extension, shared with the integration tier so the
# two cannot drift. The heavy part is compiling DuckDB from source, so this is path-filtered and does
# not run on documentation commits.

name: extension

on:
  push:
    branches: [v1.5-variegata]
    paths:
      - src/**
      - test/**
      - dotnet/**
      - scripts/**
      - extension_config.cmake
      - CMakeLists.txt
      - Makefile
      - .gitmodules
      # Submodule POINTERS, not directory globs: a gitlink shows up in the diff as this exact path,
      # and from this repo's point of view there are no files under it. Without these, bumping the
      # Delta engine or DuckDB itself — the highest-risk changes we make — runs no CI at all.
      # (Missing until 2026-07-26: the two engineered-wood bumps that day only ran because they
      # happened to touch dotnet/ as well, and the test-deletion bump ran nothing.)
      # DuckDB.ExtensionKit is deliberately absent: this tier never compiles it, only the
      # dispatch-triggered packaging tier does.
      - engineered-wood
      - duckdb
      - extension-ci-tools
      - .github/workflows/extension.yml
      - .github/actions/build-extension/**
  pull_request:
    branches: [v1.5-variegata]
    paths:
      - src/**
      - test/**
      - dotnet/**
      - scripts/**
      - extension_config.cmake
      - CMakeLists.txt
      - Makefile
      - .gitmodules
      - engineered-wood        # submodule pointers — see the note above
      - duckdb
      - extension-ci-tools
      - .github/workflows/extension.yml
      - .github/actions/build-extension/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

# NOTE on OVERRIDE_GIT_DESCRIBE, deliberately left unset here (the composite action's input defaults
# to empty). It makes the build declare a real DuckDB release instead of v0.0.1, which a stock DuckDB
# requires before it will accept the LOADABLE — so the packaging workflow will need it. But this job
# builds `unittest`, where the extension is statically embedded and no version check applies, and
# setting it broke a run: fabricator's Load clones parquet_scan and reached parquet via
# ExtensionHelper::AutoLoadExtension, which resolves from DISK only, so on a bare runner Load threw
# "Function with name \"parquet_scan\" not found" and every bridge-dependent suite failed. Keeping
# this configure identical to the documented local one (CLAUDE.md) is the point.

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
            triplet: x64-linux
            unittest: build/release/test/unittest
          - os: windows-latest
            platform: windows_amd64
            triplet: x64-windows-static
            unittest: build/release/test/unittest.exe
          # osx_arm64 is a DEMAND-driven target, not a deployment one: DuckDB's own user base skews
          # heavily to Apple Silicon, and the capabilities such a user wants — Delta/Parquet on
          # OneLake or S3, plus a SQL Server / Fabric Warehouse connection — are portable C#.
          # Intel macs are deliberately absent (shrinking, and those runners are being retired).
          #
          # Its coverage is genuinely narrower than the other two and the docs say so: this tier plus
          # the distribution smoke, but never the Tier 2 suites, because GitHub's hosted macOS
          # runners cannot run containers, so SQL Server and MinIO are unavailable there. That costs
          # less than it sounds: the platform-specific risk is the CLR bootstrap, hostfxr resolution,
          # dlopen/dylib naming and path handling — all of which THIS tier exercises hard — whereas
          # the SQL Server suites mostly re-test provider logic that is platform-agnostic once the
          # bridge works. DAX/ADOMD on macOS is untested and stays unclaimed.
          - os: macos-latest
            platform: osx_arm64
            triplet: arm64-osx
            unittest: build/release/test/unittest
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}
    # The DuckDB compile dominates (~22 min observed); bounded so a hang cannot burn the budget.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # `true`, NOT `recursive`. Both init the four top-level submodules (duckdb,
          # extension-ci-tools, engineered-wood, DuckDB.ExtensionKit); only `recursive` would also
          # pull engineered-wood's nested parquet-testing corpus, ~1/2 GB of Apache test data that
          # nothing in this job reads. duckdb and extension-ci-tools are `shallow = true` in
          # .gitmodules, so this stays reasonably cheap despite duckdb's size.
          submodules: true

      - uses: ./.github/actions/build-extension
        with:
          triplet: ${{ matrix.triplet }}
          platform: ${{ matrix.platform }}

      - name: Run the hermetic suites
        # One process per suite with a fresh scratch directory, and assertions that the set actually
        # ran (nothing skipped, no "No tests ran", floors on suite and assertion counts). See the
        # script's header for why batching them into one process is not an option.
        shell: bash
        env:
          UNITTEST: ${{ matrix.unittest }}
        run: scripts/run-suites.sh hermetic

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            build/release/CMakeFiles/*.log
            build/release/CMakeCache.txt
          if-no-files-found: ignore
