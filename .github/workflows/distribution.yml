# Packaging tier: build the ONE-FILE artifact and prove it installs and runs itself.
#
# Produces `fabricator.duckdb_extension` per platform — the NativeAOT installer shell carrying the
# CPP-ABI core plus the managed bridge as a polyglot append — and then smoke-tests it against a STOCK
# DuckDB wheel: LOAD into an empty extension directory with ZERO environment variables, and check that
# the bridge boots, managed calls work, and a Delta round trip succeeds. 12 checks, including the two
# must-not-touch-disk rejections.
#
# TWO WAYS THIS TIER DIFFERS FROM extension.yml, both of which have already caused failures:
#
#   1. OVERRIDE_GIT_DESCRIBE is REQUIRED here and FORBIDDEN there. A stock DuckDB refuses a loadable
#      whose declared version does not match its own, and `git describe` on a shallow submodule cannot
#      supply it. In the test tier the extension is statically embedded so no check applies, and
#      setting it broke fabricator's own Load (see the note in extension.yml).
#   2. The smoke harness must run from OUTSIDE the repository. The repo root contains a `duckdb/`
#      submodule directory, which shadows the `duckdb` python module and makes `import duckdb` resolve
#      to a source tree with no extension support.
#
# macOS IS built here (the open osx_arm64 defect that used to block it is fixed and green in Tier 1), and
# it runs exactly the same pack + smoke as the others — that is the part which "makes sense" to automate:
# the AOT shell links, the polyglot artifact is assembled, and a STOCK DuckDB wheel loads it from an empty
# extension directory with zero env vars.
#
# What CI structurally CANNOT cover on macOS, and is therefore NOT claimed by a green run here:
#   * Gatekeeper. A runner never quarantines what it built itself, so `com.apple.quarantine` on a
#     browser-downloaded artifact is only reproducible on a real Mac.
#   * Code signing / notarization. Needs a paid Developer ID, and there is an open question whether a
#     signed Mach-O even tolerates our polyglot append (codesign covers the file; DuckDB's footer must be
#     the LAST bytes). Probe with an ad-hoc `codesign -s -` + `codesign --verify --strict` before buying
#     anything — see the signing notes in CLAUDE.md.

name: distribution

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

env:
  # ONE source of truth. These two must agree: the version stamped into the artifact's footer and the
  # wheel the smoke test loads it into. A mismatch is precisely what the compatibility gate rejects,
  # so deriving both from one variable removes the possibility of a confusing false failure.
  DUCKDB_VERSION: v1.5.5
  DUCKDB_WHEEL: 1.5.5

defaults:
  run:
    shell: bash

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE SKU per platform EXCEPT linux, which ships both. A dev box should not need .NET
          # installed (self-contained, ~61 MB), while Fabric notebooks already ship .NET 8, so the
          # framework-dependent build is both smaller and the relevant one there (~40 MB).
          - os: windows-latest
            platform: windows_amd64
            rid: win-x64
            triplet: x64-windows-static
            sku: Standalone
            managed_mode: SelfContained
          - os: ubuntu-latest
            platform: linux_amd64
            rid: linux-x64
            triplet: x64-linux
            sku: Standard
            managed_mode: Framework
          # Linux is the ONE platform that ships BOTH SKUs, because on linux the two audiences are
          # genuinely different machines: a Fabric notebook image already has .NET 8 (Standard is
          # smaller and is the SKU validated there), while a bare container or a linux dev box may have
          # no .NET at all — and there the Standard artifact does not degrade gracefully, it fails at
          # LOAD in hostfxr resolution. Neither SKU substitutes for the other, so this is two assets
          # rather than a choice. The README has advertised "two flavours per platform" from the start;
          # this closes the half of that promise that costs one extra job.
          - os: ubuntu-latest
            platform: linux_amd64
            rid: linux-x64
            triplet: x64-linux
            sku: Standalone
            managed_mode: SelfContained
          # macOS takes the Standalone SKU for the same reason Windows does: it is a developer machine,
          # not a Fabric notebook, so shipping the runtime beats requiring a .NET install. See the header
          # for what a green macOS run does and does NOT prove (Gatekeeper and signing are out of scope).
          - os: macos-latest
            platform: osx_arm64
            rid: osx-arm64
            triplet: arm64-osx
            sku: Standalone
            managed_mode: SelfContained
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} (${{ matrix.sku }})
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ./.github/actions/build-extension
        with:
          triplet: ${{ matrix.triplet }}
          platform: ${{ matrix.platform }}
          # The LOADABLE, not `unittest`: that is what gets embedded in the artifact.
          targets: fabricator_loadable_extension
          managed-mode: ${{ matrix.managed_mode }}
          override-git-describe: ${{ env.DUCKDB_VERSION }}

      - name: Pack the single-file artifact
        # shell: pwsh, NOT the workflow default `bash`. On Windows the bash shell is Git Bash, whose PATH
        # puts GNU coreutils ahead of the MSVC tools — so NativeAOT's `link @link.rsp` resolved to
        # coreutils `link` (the hardlink utility: "extra operand ... Try 'link --help'") and the AOT
        # publish failed before packing even started. We pass IlcUseEnvironmentalTools=true, which tells
        # ILC to take the linker from PATH, so PATH ordering is load-bearing; pwsh inherits the PATH the
        # build action exported from vcvars, with MSVC first. The step invokes a .ps1 either way, so the
        # bash -> pwsh hop bought nothing. The `link` probe below makes a recurrence self-diagnosing.
        shell: pwsh
        # -SkipCore/-SkipManaged: the composite action already built both, with the SKU's managed mode.
        # The script still does the AOT publish, the deterministic payload, the polyglot append and the
        # DuckDB footer. -WithNegatives emits the failure-path artifacts the harness needs, as
        # PER-PLATFORM siblings — a Windows negative on linux proves nothing, because DuckDB checks the
        # footer's platform before any extension code runs (that produced two falsely-green passes once).
        run: |
          if ($IsWindows) { "link resolves to: $((Get-Command link -ErrorAction SilentlyContinue).Source)" }
          ./scripts/pack-distribution.ps1 `
            -Sku ${{ matrix.sku }} `
            -Rid ${{ matrix.rid }} `
            -Platform ${{ matrix.platform }} `
            -DuckDbVersion ${{ env.DUCKDB_VERSION }} `
            -SkipCore -SkipManaged -WithNegatives

      - name: Smoke-test against a stock DuckDB wheel
        run: |
          python -m pip install --quiet "duckdb==${DUCKDB_WHEEL}"
          artifact="$GITHUB_WORKSPACE/build/distribution/${{ matrix.platform }}/fabricator.duckdb_extension"
          ls -l "$artifact"
          # cd OUT of the repository: the `duckdb/` submodule directory shadows the module otherwise.
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/test/distribution/smoke_distribution.py" "$artifact"

      - uses: actions/upload-artifact@v4
        with:
          # The DuckDB version is IN the artifact name on purpose. We will ship two lines concurrently
          # (v1.5-variegata and a future `main`), and the shipped FILE cannot carry a version — DuckDB
          # derives an extension's entry symbol from its filename, so it must stay exactly
          # `fabricator.duckdb_extension`. The distinguishing information therefore has to ride the
          # container: this artifact name, and later the release tag + asset name. See CLAUDE.md
          # "TWO CONCURRENT RELEASE LINES".
          name: fabricator-${{ env.DUCKDB_VERSION }}-${{ matrix.platform }}-${{ matrix.sku }}
          path: build/distribution/${{ matrix.platform }}/fabricator.duckdb_extension
          if-no-files-found: error
          # Compresses poorly (the payload is already a zip) and it is large, so keep it briefly.
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------
  # NuGet: the two assemblies a PLUGIN references, packed ONCE.
  #
  # ⚠ ONCE, not per matrix leg, and that is the whole reason this is its own job: the packages are pure IL
  # (lib/net10.0 + lib/net8.0) and platform-independent, so packing them inside `pack` would produce four
  # identical artifacts whose upload names would collide — and the one that won would be decided by which
  # leg finished last.
  #
  # ⚠ NO SUBMODULES. Fabricator.Abstractions references only Apache.Arrow (NuGet) and Fabricator.Common
  # references only Abstractions, so neither needs duckdb, engineered-wood or the extension kit. That is
  # what keeps this job ~1 minute next to `pack`'s half hour, and it is a property worth preserving: a
  # package that needed a submodule would be a package a plugin author could not reproduce.
  #
  # The version comes from ./VERSION, the same file the C++ build reads, so a package cannot claim a
  # version the extension does not. docs/plugin-services.md §11.
  # ---------------------------------------------------------------------------------------------------
  nuget:
    name: nuget packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 builds both TFMs; the 8.0 SDK is what supplies the net8.0 targeting pack.
          dotnet-version: |
            8.0.x
            10.0.x

      # pwsh is preinstalled on ubuntu-latest. The script is the one place that names WHICH projects are
      # packable — `dotnet pack` on a project whose IsPackable is false succeeds and emits nothing, so it
      # asserts the .nupkg exists rather than trusting the exit code.
      - name: Pack
        shell: pwsh
        run: ./scripts/pack-nuget.ps1 -Clean

      - name: Report
        run: ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          # NOT `fabricator-*`: the release job globs the platform artifacts by that prefix and errors on a
          # directory without a `fabricator.duckdb_extension`, so this must not look like one.
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------------------------------
  # Release: attach one archive per (platform x SKU) to a GitHub release. Tag pushes only — a dispatch
  # still produces artifacts, it just does not publish anything.
  #
  # WHY ARCHIVES AND NOT THE BARE FILE. DuckDB derives an extension's entry symbol from its FILE NAME, so
  # the thing a user loads must be named exactly `fabricator.duckdb_extension`. A release asset called
  # `fabricator-v1.5.5-linux_amd64-Standard.duckdb_extension` would therefore FAIL to load after download
  # (DuckDB would look for `fabricator-v1.5.5-linux_amd64-Standard_duckdb_cpp_init`), and asset names must
  # be unique within a release, so the bare name cannot be reused across platforms either. Shipping a
  # versioned ZIP resolves both: the ARCHIVE name distinguishes platform/SKU/DuckDB version (and hence the
  # release line), while the file inside keeps the mandatory name. This is the concrete consequence of the
  # "cannot rename the shipped file" constraint in CLAUDE.md "TWO CONCURRENT RELEASE LINES".
  #
  # Created as a DRAFT on purpose: publishing is outward-facing and irreversible-ish (people fetch it), so
  # a human reviews the notes and assets and presses publish.
  # ---------------------------------------------------------------------------------------------------
  release:
    name: release (draft)
    needs: [pack, nuget]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a release; the rest of this workflow stays read-only
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package each platform as a versioned archive
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          count=0
          # /!\ `fabricator-*`, not `*`: since the nuget job there is a downloaded directory that is NOT a
          # platform artifact, and the check below errors on anything without a fabricator.duckdb_extension.
          # Narrowing the glob keeps that guard aimed at exactly the artifacts it is about.
          for d in artifacts/fabricator-*/; do
            name=$(basename "$d")   # fabricator-<duckdbversion>-<platform>-<sku>
            if [ ! -f "$d/fabricator.duckdb_extension" ]; then
              echo "::error::$d has no fabricator.duckdb_extension"; exit 1
            fi
            # -j would flatten; we are already zipping from inside the directory so the archive contains
            # exactly one entry named fabricator.duckdb_extension.
            (cd "$d" && zip -q -X "$GITHUB_WORKSPACE/release/$name.zip" fabricator.duckdb_extension)
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then echo '::error::no artifacts were downloaded'; exit 1; fi

          # The NuGet packages ride along UNZIPPED: they are already archives, and a plugin author points a
          # local feed at a FOLDER of .nupkg files, so re-wrapping them would only add a step for the
          # consumer. Unlike the extension they may also be renamed freely - a package's identity is its
          # nuspec, not its file name - so no versioned wrapper is needed to keep them distinguishable.
          nupkgs=(artifacts/nuget-packages/*.nupkg)
          if [ "${#nupkgs[@]}" -eq 0 ]; then echo '::error::the nuget job produced no .nupkg'; exit 1; fi
          cp "${nupkgs[@]}" release/

          echo "packaged $count archive(s) + ${#nupkgs[@]} package(s):"
          ls -lh release

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          Built against **DuckDB __DUCKDB_VERSION__**. An artifact only loads into that DuckDB version —
          the version is recorded in the extension footer and checked before any extension code runs, so a
          mismatch fails with a clear error rather than misbehaving.

          Each asset is a ZIP containing a single file, `fabricator.duckdb_extension`. **Do not rename it**
          — DuckDB derives the extension's entry symbol from the file name. Unzip it and load it:

          ```sql
          LOAD '/path/to/fabricator.duckdb_extension';
          ```

          `allow_unsigned_extensions` is required (unchanged from previous builds).

          **Writing a plugin?** The two `.nupkg` assets are the contract:
          `Fabricator.Abstractions` (interfaces, POCOs, the host-service locator) and the optional
          `Fabricator.Common` (reusable implementations). Drop them in a folder, point a `nuget.config`
          at it, and reference `Fabricator.Abstractions` — no checkout of this repo is needed. Use
          `ExcludeAssets="runtime"` so the plugin does not carry its own copy of the contract: it must
          resolve to the one the host already loaded. See `docs/plugin-services.md`.

          SKUs: **Standalone** ships the .NET runtime (no prerequisite); **Standard** is
          framework-dependent and expects a provided .NET 8+ (the relevant SKU for Fabric notebooks,
          which already have one).

          macOS: the artifact is built and smoke-tested in CI, but it is **not code-signed or notarized**.
          A browser download carries `com.apple.quarantine`, which Gatekeeper may refuse; clear it with
          `xattr -d com.apple.quarantine fabricator.duckdb_extension`, or fetch with `curl`, which does not
          set the attribute.
          EOF
          )
          notes=${notes//__DUCKDB_VERSION__/$DUCKDB_VERSION}
          # IDEMPOTENT, because a re-cut is normal: while a release is still a DRAFT its tag may be moved
          # onto a newer commit (CLAUDE.md records three such moves), and this workflow then re-runs for the
          # SAME tag name. `gh release create` FAILS outright on an existing release, so the pack jobs would
          # all succeed and only this final step would error — the most annoying possible place to fail.
          # Updating in place also avoids deleting a draft just to rebuild its assets.
          TAG="${{ github.ref_name }}"
          TITLE="fabricator $TAG — DuckDB ${DUCKDB_VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists — updating it in place"
            # --clobber replaces same-named assets; names are <duckdbversion>-<platform>-<sku> and stable.
            gh release upload "$TAG" release/*.zip release/*.nupkg --clobber --repo "${{ github.repository }}"
            # Re-assert the title/notes AND that it is still a draft, so a re-cut cannot silently publish.
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$notes" \
              --draft=true
          else
            gh release create "$TAG" release/*.zip release/*.nupkg \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$notes" \
              --draft
          fi
