# Tier 0 of this repo's CI: the pure-.NET logic that needs no toolchain to test.
#
# Deliberately the FIRST workflow, because it is the cheapest useful one — no C++ toolchain, no
# vcpkg, no .NET publish, no SQL Server, no MinIO, no submodules. Two minutes.
#
# TWO projects now, one job each:
#   Fabricator.Installer.Core.Tests  the single-file-distribution logic (the payload packer, the
#                                    polyglot reader/writer, DuckDB extension-directory resolution,
#                                    the compatibility gate, the staging/locking extractor)
#   Fabricator.Bridge.Tests          BRIDGE logic whose closure is the base class library — today the Fabric
#                                    variable-library definition format and the Fabric SQL endpoint host
#                                    derivation (an UNDOCUMENTED base32 encoding, so the case that most needs
#                                    offline tests: it must return null, never a wrong workspace id)
#
# ⚠ The workflow is still called `installer-core` for a HISTORICAL reason and nothing more: renaming
# it would rename every status check. Read it as "tier 0", not as "the installer".
#
# ⚠ The admission rule for the Bridge project is what keeps this tier cheap, and it is load-bearing:
# it compiles selected Bridge SOURCE FILES rather than referencing Fabricator.Bridge, because that
# project references engineered-wood (a SUBMODULE) plus Arrow, the Fabric SDK, SqlClient and the
# AWS/Azure SDKs. A ProjectReference would drag all of that in and destroy the property this tier
# exists for. See the csproj, which says so at the point someone would be tempted to "fix" it.
#
# The other tiers:
#   Tier 1  build + the hermetic suites, 3 platforms                                    (push/PR)
#   Tier 2  the service suites via docker/docker-compose.yml                            (scheduled)
#   Tier 3  the single-file artifact + smoke against a stock DuckDB wheel               (dispatch/tags)
#   manual  DAX (needs Power BI Desktop), live Fabric/OneLake, the deltars suites
#
# See CLAUDE.md; the branch is v1.5-variegata, mirroring DuckDB's 1.5 release line.

name: installer-core

on:
  # ⚠ `dotnet/Fabricator.Bridge/**` is listed — NOT just the one file the Bridge tests currently
  # link. Filtering on the individual linked file would silently stop covering the next one someone
  # links, which is the same failure as the submodule-pointer omission recorded in CLAUDE.md: a
  # path filter that misses the very change the gate exists to guard. Tier 0 is two minutes, so
  # running it for any Bridge edit is the cheap side of that trade.
  push:
    branches: [v1.5-variegata]
    paths:
      - dotnet/Fabricator.Installer.Core/**
      - dotnet/Fabricator.Installer.Core.Tests/**
      - dotnet/Fabricator.Bridge/**
      - dotnet/Fabricator.Bridge.Tests/**
      - dotnet/Directory.Build.props
      - .github/workflows/installer-core.yml
  pull_request:
    branches: [v1.5-variegata]
    paths:
      - dotnet/Fabricator.Installer.Core/**
      - dotnet/Fabricator.Installer.Core.Tests/**
      - dotnet/Fabricator.Bridge/**
      - dotnet/Fabricator.Bridge.Tests/**
      - dotnet/Directory.Build.props
      - .github/workflows/installer-core.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # One bash script per step that works on both runners (windows-latest ships Git Bash).
    # GitHub invokes it with -eo pipefail, which the test-count assertion below relies on:
    # without pipefail a failing `dotnet test` piped into `tee` would be masked by tee's exit 0.
    shell: bash

jobs:
  test:
    # Both operating systems on purpose: three tests take a Windows-only path (the upgrade-in-use
    # rename-aside promote, and path-separator normalisation), and the resolver's Windows behaviour
    # differs from POSIX. Both target frameworks on purpose too: net8.0 is the deployment floor (the
    # runtime preinstalled in Fabric notebooks), net10.0 the default.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tfm: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.tfm }}

    steps:
      - uses: actions/checkout@v4
        with:
          # No submodules: this project's entire closure is Installer.Core (zero package
          # references) plus xunit. Note that `submodules: recursive` would be actively harmful
          # here — it pulls engineered-wood's nested parquet-testing corpus, ~1/2 GB of Apache
          # test data that nothing in this job needs.
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 builds both TFMs; the 8.0 SDK is what supplies the .NET 8 runtime needed to
          # actually EXECUTE the net8.0 test run.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: |
          dotnet test dotnet/Fabricator.Installer.Core.Tests \
            -c Release -f ${{ matrix.tfm }} --nologo \
            | tee test-output.txt

      # Tripwire against a silently shrinking suite. `dotnet test` exits 0 if a project builds and
      # runs a REDUCED set of tests, so a green check alone does not prove coverage held — the same
      # falsely-green failure mode that once produced two passing "negative" distribution checks
      # which were in fact never exercising the code path. A floor (not an equality) is deliberate:
      # adding tests must not break CI, losing them must.
      - name: Assert the suite actually ran
        env:
          EXPECTED_MINIMUM: 92
        run: |
          # TOTAL, not Passed: two upgrade-in-use cases are Windows-only and report as SKIPPED on
          # Linux (via Assert.SkipUnless — deliberately, so a vacuous early-return cannot be counted
          # as coverage). Total therefore holds at 92 on both runners while Passed does not. Actual
          # failures need no floor of their own: `dotnet test` already exits non-zero for those.
          total=$(grep -oE 'Total:[[:space:]]+[0-9]+' test-output.txt | grep -oE '[0-9]+' | head -1)
          if [ -z "$total" ]; then
            echo "::error::Could not parse a test count out of the dotnet test output."
            exit 1
          fi
          echo "total=$total (floor $EXPECTED_MINIMUM)"
          if [ "$total" -lt "$EXPECTED_MINIMUM" ]; then
            echo "::error::Only $total tests were discovered; expected at least $EXPECTED_MINIMUM. Tests were lost."
            exit 1
          fi

  # A SEPARATE job, not another step in `test`, and that is forced rather than tidy: the count
  # tripwire reads the FIRST `Total:` in its output file (`head -1`), so a second `dotnet test`
  # piped into the same file would leave this project's floor silently unchecked — a tripwire that
  # looks armed and is not.
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tfm: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    # Both OSes on purpose. The format code under test normalises PATH SEPARATORS (Fabric's own docs
    # spell the value-set folder with a backslash) and asserts on CRLF in stored JSON; pinning that
    # behaviour on one platform only is how an accidental Path.DirectorySeparatorChar or
    # Environment.NewLine dependency would hide. Both TFMs because net8.0 is the deployment floor.
    name: bridge / ${{ matrix.os }} / ${{ matrix.tfm }}

    steps:
      - uses: actions/checkout@v4
        with:
          # NO SUBMODULES, and this project is designed so that holds: it compiles BCL-only Bridge
          # source files instead of referencing Fabricator.Bridge (which references engineered-wood).
          # If this ever has to become `true`, the admission rule has been broken — fix the reference,
          # not this line.
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: |
          dotnet test dotnet/Fabricator.Bridge.Tests \
            -c Release -f ${{ matrix.tfm }} --nologo \
            | tee bridge-test-output.txt

      # Same rationale as the installer floor above: `dotnet test` exits 0 for a project that builds
      # and runs FEWER tests than it used to, so the green check alone does not prove coverage held.
      # A floor, not an equality — adding tests must not break CI, losing them must.
      - name: Assert the suite actually ran
        env:
          # 85 cases today (theories expand): the variable-library format plus the Fabric SQL endpoint
          # host/connstr derivation. Nothing here is platform-skipped, so Total is the same on both runners.
          EXPECTED_MINIMUM: 85
        run: |
          total=$(grep -oE 'Total:[[:space:]]+[0-9]+' bridge-test-output.txt | grep -oE '[0-9]+' | head -1)
          if [ -z "$total" ]; then
            echo "::error::Could not parse a test count out of the dotnet test output."
            exit 1
          fi
          echo "total=$total (floor $EXPECTED_MINIMUM)"
          if [ "$total" -lt "$EXPECTED_MINIMUM" ]; then
            echo "::error::Only $total tests were discovered; expected at least $EXPECTED_MINIMUM. Tests were lost."
            exit 1
          fi
